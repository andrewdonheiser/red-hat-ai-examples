---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-sa
  namespace: github-runners
---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-token
  namespace: github-runners
type: Opaque
stringData:
  # Replace with your actual token from GitHub Settings → Actions → Runners
  token: "AXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: github-runners
type: Opaque
stringData:
  # Replace with your HuggingFace token (optional, for gated models)
  token: "hf_xxxxxxxxxxxxxxxxxxxx"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-scripts
  namespace: github-runners
data:
  start.sh: |
    #!/bin/bash
    set -e

    cd /home/runner

    # Configure the runner
    ./config.sh \
      --url "${GITHUB_URL}" \
      --token "${RUNNER_TOKEN}" \
      --name "${RUNNER_NAME}" \
      --labels "${RUNNER_LABELS}" \
      --unattended \
      --replace

    # Cleanup on exit
    cleanup() {
      ./config.sh remove --token "${RUNNER_TOKEN}"
    }
    trap cleanup EXIT

    # Run the runner
    ./run.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner
  namespace: github-runners
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner-sa

      # GPU node selection
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S

      # Tolerate GPU taints
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest

          command: ["/bin/bash", "/scripts/start.sh"]

          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITHUB_URL
              value: "https://github.com/YOUR_ORG/red-hat-ai-examples"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-token
                  key: token
            - name: RUNNER_LABELS
              value: "self-hosted,rhoai,gpu,L40S"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true

          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "64Gi"
              cpu: "16"
              ephemeral-storage: "200Gi"
            requests:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "8"
              ephemeral-storage: "100Gi"

          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: scripts
              mountPath: /scripts

      volumes:
        - name: work
          emptyDir:
            sizeLimit: 500Gi
        - name: scripts
          configMap:
            name: runner-scripts
            defaultMode: 0755
